name = "MPIgenerator"
uuid = "01aa870b-fa19-4f9c-adda-70d3c70d3e08"

[deps]
Clang = "40e3b903-d033-50b4-a0cc-940c62c95e31"
MPICH_jll = "7cb0a576-ebde-5e09-9194-50597f1243b4"
MPIPreferences = "3da0fdf6-3ccc-4f1b-acd9-58baa6c99267"
OpenMPI_jll = "fe0851c0-eecd-5654-98d4-656369965a5c"

[compat]
# Which MPI standard version the generated bindings cover is decided here: the
# headers come from these JLLs. MPICH 5.0 is MPI 5.0, Open MPI 5.0 is MPI 3.1.
MPICH_jll = "5"
OpenMPI_jll = "5"
MPIPreferences = "0.1.8"
# Clang 0.17 needs Clang_jll <= 15, hence an LLVM 15 Julia, hence Julia 1.10.
# Pinned to one minor version because Clang.jl drives the formatting of the whole
# generated file: bump it deliberately, in its own commit, so that any reformatting
# is reviewable separately from a change of MPI version.
Clang = "~0.17"
julia = "~1.10"
